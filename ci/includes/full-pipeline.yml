# 通常CIのjob定義。入口は.gitlab-ci.yml。既存のrules/needs/成果物契約を一括で維持する。
include:
  - local: ci/includes/security.yml
  - local: ci/includes/oci-validation.yml
  - local: ci/includes/oci-delivery.yml
  - local: ci/includes/registry-retrieval.yml

.go-validation:
  image: golang:1.27.1-bookworm@sha256:648f440f42a0958804efb24df176f806f9d353b41f1c0627f666428e40310f6b
  cache:
    key:
      prefix: go-1.27.1-linux-amd64-$CI_COMMIT_REF_PROTECTED
      files: [ci/manifest-update.go, ci/tool-versions.env]
    paths: [.cache/go/pkg/mod/, .cache/go-build/]
    policy: pull-push
    unprotect: false

manifest-helper-test:
  extends: .go-validation
  stage: validate
  script:
    - go test -v ci/manifest-update.go ci/manifest-update_test.go
    - 'if [ "${AT13_FORCE_VALIDATION_FAILURE:-false}" = "true" ]; then echo "AT13 expected validation failure; delivery must remain skipped"; exit 99; fi'

.frontend-validation:
  image: node:24.19.0-alpine3.23@sha256:244cc2b53f46f9e876304391d17682b0ddae9ac33491f4857e25e35a36ba7995
  cache:
    key:
      prefix: npm-node24.19.0-linux-amd64-$CI_COMMIT_REF_PROTECTED
      files: [package-lock.json, ci/tool-versions.env]
    paths: [.npm/]
    policy: pull-push
    unprotect: false
  before_script: ['npm ci --cache .npm --prefer-offline']

lint:
  extends: .frontend-validation
  stage: validate
  script: ['npm run lint']

typecheck:
  extends: .frontend-validation
  stage: validate
  script: ['npm run typecheck']

unit-test:
  extends: .frontend-validation
  stage: validate
  script: ['npm test -- --run']

frontend-build:
  extends: .frontend-validation
  stage: validate
  script: ['npm run build']
  artifacts:
    expire_in: 1 day
    paths: [dist/]
